name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Build iOS App with Xcode
        run: |
          cd ios
          # Find the actual workspace name dynamically so it never fails
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | grep -m 1 "Schemes:" -A 1 | tail -n 1 | xargs)
          
          echo "Found workspace: $WORKSPACE"
          echo "Found scheme: $SCHEME"
          
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            build CODE_SIGNING_ALLOWED=NO

      - name: Create Unsigned IPA Package
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          mkdir Payload
          # Automatically find the .app bundle name
          APP_NAME=$(ls -d *.app | head -n 1)
          mv "$APP_NAME" Payload/
          zip -r ../../../App-Unsigned.ipa Payload
          cd ../../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Unsigned-IPA
          path: ios/App-Unsigned.ipa