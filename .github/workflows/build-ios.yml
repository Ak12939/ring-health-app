name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Expo Prebuild & CocoaPods
        run: |
          npx expo prebuild --platform ios --clean
          cd ios
          pod install
          cd ..

      - name: Build iOS App with Xcode
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          
          # Filter out Pods and Expo helper schemes to find the main app scheme
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | grep -A 20 "Schemes:" | tail -n +3 | tr -d ' ' | grep -vE '^(Pods-|EX|Expo|React|Yoga|RCT)' | head -n 1)
          
          # Fallback if filter is too aggressive
          if [ -z "$SCHEME" ]; then
            SCHEME="RingPulse"
          fi
          
          echo "Found workspace: $WORKSPACE"
          echo "Found scheme: $SCHEME"
          
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            build CODE_SIGNING_ALLOWED=NO

      - name: Create Unsigned IPA Package
        run: |
          cd ios
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" -maxdepth 5 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found anywhere in build directory!"
            exit 1
          fi
          echo "Found app bundle: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r ../App-Unsigned.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Unsigned-IPA
          path: ios/App-Unsigned.ipa